<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hands — Resultados</title>
  <meta name="description" content="Galería de resultados Hands: transformaciones antes y después en alojamientos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div id="site-header"></div>

  <main>
    <section class="section section-results">
      <div class="page-wide">
        <div class="section-head section-head-split">
          <div>
            <p class="eyebrow" data-i18n="resultsPageEyebrow">Resultados</p>
            <h1 data-i18n="resultsPageTitle">Resultados Hands</h1>
          </div>
          <p data-i18n="resultsPageLead">Galería antes y después. Las fotos de demostración se reemplazarán por trabajos reales de Hands.</p>
        </div>

        <div class="results-filters filter-chips" id="resultsFilters" role="group" aria-label="Filtros">
          <button type="button" class="chip is-active" data-filter="all" data-i18n="filterAll">Todos</button>
          <button type="button" class="chip" data-filter="residential" data-i18n="filterResidential">Residencial</button>
          <button type="button" class="chip" data-filter="kitchen" data-i18n="filterKitchen">Cocinas</button>
          <button type="button" class="chip" data-filter="bath" data-i18n="filterBath">Baños</button>
          <button type="button" class="chip" data-filter="room" data-i18n="filterRoom">Habitaciones</button>
        </div>

        <div class="before-after-grid" id="resultsGallery">
          <article class="before-after-card" data-category="kitchen residential">
            <div class="before-after-pair">
              <figure>
                <img src="img/photos/kitchen-before.jpg" alt="Cocina en desorden antes del servicio" width="480" height="360" />
                <figcaption data-i18n="resultsBefore">Antes</figcaption>
              </figure>
              <figure>
                <img src="img/photos/kitchen-after.jpg" alt="Cocina limpia y ordenada después del servicio" width="480" height="360" />
                <figcaption data-i18n="resultsAfter">Después</figcaption>
              </figure>
            </div>
            <h3 data-i18n="resultsPageKitchen">Cocina</h3>
          </article>

          <article class="before-after-card" data-category="room residential">
            <div class="before-after-pair">
              <figure>
                <img src="img/photos/bedroom-before.jpg" alt="Habitación en desorden antes del servicio" width="480" height="360" />
                <figcaption data-i18n="resultsBefore">Antes</figcaption>
              </figure>
              <figure>
                <img src="img/photos/bedroom-after.jpg" alt="Habitación ordenada y lista para huéspedes" width="480" height="360" />
                <figcaption data-i18n="resultsAfter">Después</figcaption>
              </figure>
            </div>
            <h3 data-i18n="resultsPageRoom">Habitación</h3>
          </article>

          <article class="before-after-card" data-category="bath residential">
            <div class="before-after-pair">
              <figure>
                <img src="img/photos/bathroom-before.jpg" alt="Baño sucio y desordenado antes del servicio" width="480" height="360" />
                <figcaption data-i18n="resultsBefore">Antes</figcaption>
              </figure>
              <figure>
                <img src="img/photos/bathroom-after.jpg" alt="Baño limpio y ordenado después del servicio" width="480" height="360" />
                <figcaption data-i18n="resultsAfter">Después</figcaption>
              </figure>
            </div>
            <h3 data-i18n="resultsPageBath">Baño</h3>
          </article>
        </div>

        <div class="section-more">
          <a class="btn btn-primary" href="build.html">
            <span data-i18n="resultsPageCta">Arma tu servicio</span>
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/visits.js"></script>
  <script src="js/bookings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
